sonar.projectKey=mfeflow_mfeflow
sonar.organization=mfeflow
sonar.projectName=mfeflow

sonar.sources=packages,examples
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test-d.ts,**/test/**
sonar.exclusions=**/dist/**,**/doc_build/**,**/node_modules/**,**/coverage/**,**/__fixture__/**,**/@mf-types/**
sonar.coverage.exclusions=examples/**,**/bin/**,**/rslib.config.ts,**/vitest.config.ts
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,examples/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
