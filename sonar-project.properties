sonar.projectKey=mfeflow_mfeflow
sonar.organization=mfeflow
sonar.projectName=mfeflow

sonar.sources=packages,examples
sonar.tests=packages,examples
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test-d.ts,**/*.spec.ts,**/test/**
sonar.exclusions=**/dist/**,**/doc_build/**,**/node_modules/**,**/coverage/**,**/__fixture__/**,**/@mf-types/**
sonar.coverage.exclusions=examples/**,**/bin/**,**/rslib.config.ts,**/vitest.config.ts
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,examples/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The storefront e2e server is local test infrastructure on localhost: plain http
# is intended, and every file path is checked against its dist folder after
# path.join (Sonar's taint analysis does not see that guard).
sonar.issue.ignore.multicriteria=e2eHttp,e2ePath,e2eCors
sonar.issue.ignore.multicriteria.e2eHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e2eHttp.resourceKey=examples/storefront/e2e/**
sonar.issue.ignore.multicriteria.e2ePath.ruleKey=tssecurity:S2083
sonar.issue.ignore.multicriteria.e2ePath.resourceKey=examples/storefront/e2e/**

# support.ts runs a fake OTLP collector and backend that the browser test posts to
# from another origin; they answer with permissive CORS on purpose and only on localhost.
sonar.issue.ignore.multicriteria.e2eCors.ruleKey=typescript:S5122
sonar.issue.ignore.multicriteria.e2eCors.resourceKey=examples/storefront/e2e/**
