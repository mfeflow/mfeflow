packages:
  - packages/*
  - apps/*

# Latest stable versions, checked 2026-10-31.
catalog:
  '@changesets/cli': 3.0.3
  '@commitlint/cli': 21.2.4
  '@commitlint/config-conventional': 21.2.4
  '@rslib/core': 1.0.5
  '@rspress/core': 2.0.23
  '@types/node': 26.6.6
  '@vitest/coverage-v8': 5.0.5
  lefthook: 2.2.2
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  prettier: 3.9.10
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.0.5

minimumReleaseAgeExclude:
  - eslint@10.14.0

# Dependencies allowed to run install scripts.
allowBuilds:
  lefthook: true
