  '@playwright/test': 1.64.1
  '@rsbuild/core': 2.3.0
  '@rsbuild/plugin-react': 2.1.1
  '@rslib/core': 1.0.5
  '@rspress/core': 2.0.23
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/coverage-v8': 5.0.5
  es-module-lexer: 3.0.4
  i18next: 26.5.12
  jsdom: 30.1.3
  lefthook: 2.2.2
  lighthouse: 13.6.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  prettier: 3.9.10
