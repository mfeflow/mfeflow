pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,tsx,json,md,yml,yaml}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{js,ts,tsx}'
      run: pnpm eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm typecheck && pnpm test
