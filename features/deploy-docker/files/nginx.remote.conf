# A remote. __NAME__ and __VERSION__ are filled in when the image is built, from the app name and
# its package.json version. The files are stored once and answer on two paths:
#   /mfe/__NAME__/__VERSION__/...  the registry layout, cached for a year (the version is the name)
#   /...                           the same files, revalidated every time
# Any other /mfe/ path is a 404 here, so an old URL never gets a year of someone else's files.

# The stock mime.types has no .mjs. This block sits at http level, where it adds to the stock
# list; inside a server block a types block would replace the whole list.
types {
  text/javascript mjs;
}

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
# This image has no brotli module. Let a CDN or ingress do brotli if you want it.

# The shell origins the start script wrote from SHELL_ORIGINS. With none set the file does not
# exist (the * makes nginx accept that), the variable is empty and no CORS header is sent.
map $http_origin $mfe_cors_origin {
  default "";
  include /tmp/mfe-runtime/cors-origins*.map;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /mfe/__NAME__/__VERSION__/ {
    alias /usr/share/nginx/html/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin $mfe_cors_origin always;
    add_header Vary Origin always;
  }

  location ^~ /mfe/ { return 404; }

  # Hashed build output.
  location ^~ /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin $mfe_cors_origin always;
    add_header Vary Origin always;
  }

  # mf-manifest.json, remoteEntry.js and everything else without a hash in its name.
  location / {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin $mfe_cors_origin always;
    add_header Vary Origin always;
  }
}
