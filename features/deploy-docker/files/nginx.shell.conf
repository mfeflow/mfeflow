# The shell. Every response says how long it may be cached: revalidate by default, a year only for
# files whose name changes when their content does (/static/). nginx drops the headers of the
# level above as soon as a location sets its own, so each location repeats Cache-Control.

# The stock mime.types has no .mjs. This block sits at http level, where it adds to the stock
# list; inside a server block a types block would replace the whole list.
types {
  text/javascript mjs;
}

# add_header is not inherited by a location that sets its own, so every location repeats the
# security headers beside Cache-Control.
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
# This image has no brotli module. Let a CDN or ingress do brotli if you want it.

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Dotfiles (.env, .git) are never served. .well-known stays reachable.
  location ~ /\.(?!well-known) { return 404; }

  # Written by the start script (or mounted as a ConfigMap) so the image holds no environment.
  location = /config/runtime-config.json {
    alias /tmp/mfe-runtime/runtime-config.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Mounted, never baked in: a ConfigMap in Kubernetes, a file in Docker, or leave it out and point
  # registryUrls in the runtime config at a registry you host elsewhere.
  location = /registry/index.json {
    alias /tmp/mfe-registry/index.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location ^~ /config/ { return 404; }
  location ^~ /registry/ { return 404; }

  # Hashed build output.
  location ^~ /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Any other file (favicon, mf-manifest.json): a missing one is a real 404, never index.html.
  location ~ \.[A-Za-z0-9]+$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Routes. The fallback to index.html lives here and nowhere else.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
