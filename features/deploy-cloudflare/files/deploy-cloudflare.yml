name: deploy-cloudflare

# Builds once, then deploys every app to the Cloudflare Workers named in deploy/cloudflare.json. A push to main
# deploys staging. Run it by hand to choose staging or prod. Needs the secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID in the GitHub environments cloudflare-staging and cloudflare-prod (see docs/cloudflare.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy to
        type: choice
        options: [staging, prod]
        default: staging

permissions: {}

# Two deploys at once would race on the same Workers; let the first finish.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A manual run from another branch would otherwise deploy that branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: List the apps and environments
        id: plan
        env:
          DEPLOY_ENV: ${{ inputs.env || 'staging' }}
        run: |
          set -euo pipefail
          targets=$(node --experimental-strip-types scripts/deploy-cloudflare.ts plan "$DEPLOY_ENV")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: apps/*/dist
          if-no-files-found: error

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-${{ matrix.target.env }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: apps
      - name: Stage the build for this environment
        env:
          DEPLOY_ENV: ${{ matrix.target.env }}
          DEPLOY_APP: ${{ matrix.target.app }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/deploy-cloudflare.ts "$DEPLOY_ENV" "$DEPLOY_APP" --prepare-only
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --config ${{ matrix.target.config }} --env ${{ matrix.target.env }}
