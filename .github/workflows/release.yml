name: release

# Dormant until the repository variable RELEASE_ENABLED is 'true'. Flow, one job per trust level:
#
#   version  opens or updates the "chore: version packages" pull request (Changesets). No npm access.
#   plan     installs nothing and runs before any build: decides which name@version, under which
#            dist-tag and tarball file name, may be published. These outputs are the trusted list.
#   pack     installs without scripts, builds, runs the pack check, packs every public package and
#            outputs the sha256 of each tarball. No npm access.
#   publish  the only job with id-token. No checkout and no repo code: inline shell checks each
#            tarball against the plan (file name, sha256, package.json name and version) and runs
#            `npm publish` in the order the plan gives, in Environment `npm`.
#   tag      git tags `<name>@<version>` and `v<version>`, and one GitHub Release with the tarballs.
#
# No job here uses the pnpm cache: CI jobs that run install scripts write it. One-time setup, the
# mandatory owner steps and the switch to trusted publishing are in docs/versioning.md. The public
# packages are versioned together (the `fixed` group in .changeset/config.json); `pnpm check:pack`
# fails if a public package is missing from that list.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version pull request
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No `publish` input: the action only versions. GITHUB_TOKEN is for the pull request and for
      # @changesets/changelog-github, which reads pull request and author links from the API.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 input names. Tags and the GitHub Release come from the `tag` job after a publish.
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: plan
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - id: plan
        run: node scripts/release-plan.mjs plan

  pack:
    name: pack
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.pack.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check:pack
      # pnpm pack rewrites workspace: and catalog: specs to real versions.
      - id: pack
        run: node scripts/release-plan.mjs pack release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to npm
    needs: [plan, pack]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Exact Node version, the same as the publish-check job in ci.yml. npm 11.5.1 or newer is
      # needed for trusted publishing; the next step fails otherwise. No checkout: npm reads no
      # repo .npmrc, so the registry comes from here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      # Everything comes from the `plan` job (decided before the build) and the `pack` job's
      # hashes, never from a file inside the artifact. No token in this step.
      - name: Verify the tarballs against the plan
        env:
          PLAN: ${{ needs.plan.outputs.expected }}
          HASHES: ${{ needs.pack.outputs.hashes }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          npm_version=$(npm --version)
          [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)" = "11.5.1" ] ||
            fail "npm $npm_version is older than 11.5.1, which trusted publishing needs"
          [ "$(jq 'length' <<<"$PLAN")" -gt 0 ] || fail "the plan is empty"
          for f in release/*; do
            base=${f##*/}
            [ "$base" = release-manifest.json ] && continue
            [[ $base =~ ^[a-z0-9._-]+\.tgz$ ]] || fail "unexpected file in the artifact: $base"
            jq -e --arg f "$base" 'any(.[]; .tarball == $f)' <<<"$PLAN" >/dev/null ||
              fail "$base is not in the plan"
          done
          : > "$RUNNER_TEMP/verified.txt"
          while read -r item; do
            name=$(jq -r .name <<<"$item"); version=$(jq -r .version <<<"$item")
            tarball=$(jq -r .tarball <<<"$item"); tag=$(jq -r .distTag <<<"$item")
            [[ $tarball =~ ^[a-z0-9._-]+\.tgz$ ]] || fail "bad tarball name in the plan: $tarball"
            [ -f "release/$tarball" ] || fail "$tarball is missing from the artifact"
            actual=$(sha256sum "release/$tarball" | cut -d' ' -f1)
            expected=$(jq -r --arg f "$tarball" '.[$f] // empty' <<<"$HASHES")
            [ -n "$expected" ] && [ "$actual" = "$expected" ] || fail "$tarball sha256 $actual does not match the pack job's $expected"
            packed=$(tar -xzOf "release/$tarball" package/package.json)
            [ "$(jq -r .name <<<"$packed")" = "$name" ] || fail "$tarball holds a package that is not $name"
            [ "$(jq -r .version <<<"$packed")" = "$version" ] || fail "$tarball holds a version that is not $version"
            case "$version" in
              *-*) [ "$tag" != latest ] || fail "$name@$version is a prerelease and cannot take latest" ;;
              *) [ "$tag" = latest ] || fail "$name@$version is stable and must take latest" ;;
            esac
            echo "$name $version $tarball $tag" >> "$RUNNER_TEMP/verified.txt"
          done < <(jq -c '.[]' <<<"$PLAN")
      # Skips versions already on npm, so a re-run after a partial failure is safe.
      # Authentication is npm trusted publishing (OIDC) through `id-token: write`; there is no npm
      # token. A new package needs one manual first publish and a trusted publisher on npmjs.com
      # before this job can publish it (see docs/versioning.md).
      - name: Publish
        run: |
          set -euo pipefail
          while read -r name version tarball tag; do
            if npm view "$name@$version" version >/dev/null 2>"$RUNNER_TEMP/view.err"; then
              echo "skipped $name@$version, already on npm"
              continue
            fi
            grep -q E404 "$RUNNER_TEMP/view.err" || { cat "$RUNNER_TEMP/view.err"; exit 1; }
            npm publish "./release/$tarball" --provenance --access public --ignore-scripts --tag "$tag"
          done < "$RUNNER_TEMP/verified.txt"

  tag:
    name: tag and release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ needs.plan.outputs.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Tag
        run: |
          node scripts/release-plan.mjs tags | while read -r tag; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag exists"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
              echo "tagged $tag"
            fi
          done
      - name: GitHub Release
        run: |
          version=$(node scripts/release-plan.mjs tags | tail -n 1)
          node scripts/release-plan.mjs notes "${version#v}" packages/cli/CHANGELOG.md > notes.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release/* --clobber
          else
            gh release create "$version" release/* --title "$version" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
