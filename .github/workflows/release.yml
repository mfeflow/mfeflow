name: release

# Dormant until the repository variable RELEASE_ENABLED is 'true'. Flow, one job per trust level:
#
#   version  opens or updates the "chore: version packages" pull request (Changesets). No npm access.
#   plan     once no changesets are pending, finds public packages whose version is not on npm yet.
#   pack     installs without scripts, builds, runs the pack check, packs every public package and
#            writes release-manifest.json (name, version, tarball, sha256). No npm access.
#   publish  the only job with id-token: it installs nothing but Node, verifies the hashes and runs
#            `npm publish` on the tarballs from `pack`, in dependency order, in Environment `npm`.
#   tag      git tags `<name>@<version>` and `v<version>`, and one GitHub Release with the tarballs.
#
# One-time setup, and the switch to trusted publishing, are in docs/versioning.md. The public packages
# are versioned together (the `fixed` group in .changeset/config.json); `pnpm check:pack` fails if a
# public package is missing from that list.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version pull request
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No `publish` input: the action only versions. GITHUB_TOKEN is for the pull request and for
      # @changesets/changelog-github, which reads pull request and author links from the API.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: plan
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - id: plan
        run: node scripts/release-plan.mjs plan

  pack:
    name: pack
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check:pack
      # pnpm pack rewrites workspace: and catalog: specs to real versions.
      - run: node scripts/release-plan.mjs pack release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm provenance, and trusted publishing once it is configured
      contents: read
    steps:
      # Scripts only; nothing is installed from the registry in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Verify the tarballs and npm
        run: node scripts/release-plan.mjs verify release
      # Skips versions already on npm, so a re-run after a partial failure is safe.
      # NODE_AUTH_TOKEN is set on this step only, for the first release. Once trusted publishing is
      # configured on npm for every package (see docs/versioning.md), delete this env line and the
      # NPM_TOKEN secret; the id-token permission above already makes OIDC work with no other change.
      - name: Publish
        run: node scripts/release-plan.mjs publish release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  tag:
    name: tag and release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Tag
        run: |
          node scripts/release-plan.mjs tags release | while read -r tag; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag exists"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
              echo "tagged $tag"
            fi
          done
      - name: GitHub Release
        run: |
          version=$(node scripts/release-plan.mjs tags release | tail -n 1)
          node scripts/release-plan.mjs notes "${version#v}" packages/cli/CHANGELOG.md > notes.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release/* --clobber
          else
            gh release create "$version" release/* --title "$version" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
