name: release

# Dormant until npm publishing is configured: set the repository variable
# RELEASE_ENABLED=true and the secret NPM_TOKEN (an automation token that can publish
# `mfeflow`, `create-mfeflow` and `@mfeflow/*`).
#
# After the first publish, switch to npm trusted publishing (OIDC): on npmjs.com add this
# repository and workflow (release.yml) as a trusted publisher of every package, then delete
# NPM_TOKEN and the NODE_AUTH_TOKEN line below. `id-token: write` and provenance are already set.
#
# The 13 public packages are versioned together (the `fixed` group in .changeset/config.json).
# A new public package must be added to that list, or the pack check fails.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:pack
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
