name: perf

on:
  pull_request:
    paths:
      - packages/rsbuild/**
      - packages/bundler-shared/**
      - packages/runtime/**
      - packages/contracts/src/cost-model*
      - examples/storefront/**
      - .github/workflows/perf.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: cost model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @storefront/e2e exec playwright install --with-deps chromium
      # Lighthouse mobile preset with simulated throttling on /catalog, shell vs the one-app build.
      # Fails when LCP is over +300 ms, the shell adds over 32 KB of JS, or a remote adds over 10 KB.
      - run: pnpm --filter @storefront/e2e perf
        env:
          RUNS: '5'
          PERF_GATE: '1'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: examples/storefront/e2e/perf-results.json
          if-no-files-found: ignore
          retention-days: 14
