name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Check the npm tarballs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check:pack

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @storefront/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: examples/storefront/e2e/playwright-report
          retention-days: 7

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Generates a project with `mfeflow init --local`, installs and builds it, boots `pnpm dev`
      # and fetches the shell and both remotes.
      - run: node scripts/smoke.mjs

  # Runs the exact `npm publish` the release job runs, on every PR and push, with a throwaway version
  # and no auth. Same Node as the publish job.
  publish-check:
    name: publish dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2 # keep in sync with the publish job in release.yml
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Set a throwaway version (not committed)
        run: node scripts/release-plan.mjs ci-version "0.0.0-ci.${{ github.run_id }}"
      - run: node scripts/release-plan.mjs pack release --tag ci-dry-run
      - run: node scripts/release-plan.mjs publish release --dry-run

  # A feature or template folder that changed needs a new version in its feature.json, so `upgrade`
  # can tell which ones moved. Compares against the merge-base with the PR's target branch.
  feature-versions:
    name: feature versions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Check the versions
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/check-feature-versions.mjs "$BASE"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, e2e, smoke, publish-check, feature-versions]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          SMOKE: ${{ needs.smoke.result }}
          PUBLISH_CHECK: ${{ needs.publish-check.result }}
          FEATURE_VERSIONS: ${{ needs.feature-versions.result }}
        run: test "$CHECK" = "success" && test "$E2E" = "success" && test "$SMOKE" = "success" && test "$PUBLISH_CHECK" = "success" && { test "$FEATURE_VERSIONS" = "success" || test "$FEATURE_VERSIONS" = "skipped"; }
