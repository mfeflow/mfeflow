version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.x peers on typescript <6.1; lift when it supports 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      dev-dependencies:
        patterns: ['*']
    cooldown:
      default-days: 7
      semver-major-days: 30
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7
